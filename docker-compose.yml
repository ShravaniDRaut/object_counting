services:
  object-counting-app:
    build: .
    container_name: visioncount-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Real-Time Object Counting System
      - DEBUG=False
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_PATH=models/yolov8n.pt
      - CONFIDENCE_THRESHOLD=0.35
      - IOU_THRESHOLD=0.45
      - DATABASE_URL=sqlite:///./data/object_counting.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
